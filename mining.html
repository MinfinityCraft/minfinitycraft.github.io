<body class="mining-page">

  <!-- 粒子 -->

  <!-- メイン -->
  <main class="content">

    <h1 class="title">MINING</h1>

    <!-- ① 採掘場について -->
    <section class="card mining-top-card">

      <h2>採掘場について</h2>

      <p>
        採掘場では様々なブロックを採掘できます。<br>
        採掘場ごとに生成ブロックやドロップアイテムが異なります。<br><br>

        詳細データを開くことで、ブロック生成率やドロップ率を確認できます。
      </p>

    </section>



    <!-- ② 採掘場カード -->
    <section class="mine-card">

      <!-- 名前 -->
      <h2 class="mine-name">通常採掘場</h2>

      <!-- 画像 -->
      <img
        src="assets/images/mine1.jpg"
        alt="通常採掘場"
        class="mine-image"
      >

      <!-- ドロップ -->
      <div class="mine-drops">

        <span class="drop-item">もやし</span>
        <span class="drop-item">もやし</span>
        <span class="drop-item">もやし</span>

      </div>

      <!-- アコーディオン -->
      <details>

        <summary>詳細データ</summary>

        <div class="drop-data">

          <h3>⛏ 生成ブロック</h3>
          <p>・未定　0%<br>・未定　0%</p>

          <h3>🎁 ドロップアイテム</h3>
          <p>・未定　0%<br>・未定　0%</p>

        </div>

      </details>

    </section>



    

    <section class="mine-card">

  <h2 class="mine-name">新しい採掘場</h2>

  <img src="assets/images/mine2.jpg" class="mine-image" alt="新しい採掘場">

  <div class="mine-drops">
    <span class="drop-item">もやし</span>
    <span class="drop-item">もやし</span>
  </div>

    <div class="drop-data">

      <h3>⛏ 生成ブロック</h3>
      ・未定 0%

      <h3>🎁 ドロップアイテム</h3>
      ・未定 0%

  </details>

</section>
