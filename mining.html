<section class="card mine-card">

  <!-- 採掘場タイトル -->
  <h2 class="mine-name">
    通常採掘場
  </h2>

  <!-- 画像 -->
  <img
    src="assets/images/mine1.jpg"
    alt="通常採掘場"
    class="mine-image"
  >

  <!-- ドロップアイテム -->
  <div class="mine-drops">

    <span class="drop-item">
      石炭
    </span>

    <span class="drop-item">
      鉄
    </span>

    <span class="drop-item">
      銅
    </span>

  </div>

  <!-- アコーディオン -->
  <button class="accordion">

    詳細データ ▼

  </button>

  <!-- 開閉部分 -->
  <div class="accordion-content">

    <div class="mine-table">

      <!-- 生成ブロック -->
      <h3 class="mine-subtitle">
        生成ブロック
      </h3>

      <div class="mine-row">
        <span>未定</span>
        <span>0%</span>
      </div>

      <div class="mine-row">
        <span>未定</span>
        <span>0%</span>
      </div>

      <!-- ドロップアイテム -->
      <h3 class="mine-subtitle">
        ドロップアイテム
      </h3>

      <div class="mine-row">
        <span>未定</span>
        <span>0%</span>
      </div>

      <div class="mine-row">
        <span>未定</span>
        <span>0%</span>
      </div>

    </div>

  </div>

</section>
